; CI'da 'mypy src --config-file mypy.ini' olarak calistirilir (bkz.
; .github/workflows/tests.yml). src/ su ana kadar hic statik tip
; denetiminden gecmedi ve notebook'larla tutarli "duz" (flat) import
; konvansiyonu kullaniyor (bkz. tests/conftest.py) -- bu yuzden baslangic
; ayari bilincli olarak permissif: gercek tip celiskilerini/typo'lari
; yakalamayi hedefler, eksiksiz/siki tip kapsamasi zorlamaz.
[mypy]
ignore_missing_imports = True
disable_error_code = import-untyped, no-redef
follow_imports = silent

; classifier.py/field_extractor.py/answer.py/llm_factory.py/llm_json_utils.py
; (DOC-34, tool_use/structured-output gecisi tamamlandi -- 2026-09-02'de
; daraltildi): Anthropic/OpenAI SDK'larinin cok siki overload'lu
; Messages.create()/ChatCompletion.create() imzalari, bu modullerin
; **kwargs-dict tabanli cagirma deseniyle (bkz. llm_factory.AnthropicClient/
; OpenAIClient) yapisal olarak uyusmuyor -- SADECE call-overload burada
; bastiriliyor, diger tum hata siniflari (typo, yanlis tip vb.) bu
; dosyalarda hala gercek hata olarak yakalanir.
[mypy-classifier]
disable_error_code = call-overload
[mypy-field_extractor]
disable_error_code = call-overload
[mypy-answer]
disable_error_code = call-overload
[mypy-llm_factory]
disable_error_code = call-overload
[mypy-llm_json_utils]
disable_error_code = call-overload
